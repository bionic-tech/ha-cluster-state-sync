# AR-0033 — lint + dependency audit + test gate.
#
# Python version is pinned to match requirements-dev.txt: the HA release we test
# against (2026.6.4) requires Python >= 3.14.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary against the newest Home Assistant harness — see the
    # `canary` job. Home Assistant ships monthly with breaking changes;
    # without this the first sign of an API move is an upgrade that fails in
    # somebody's house.
    #
    # 🚨 This comment used to promise a canary that did not exist: every job
    # installed requirements-dev.txt, so the weekly run re-tested the same
    # pinned Home Assistant and could never find anything new. Found on
    # 2026-09-09 while answering "how do we get ahead of HA releases".
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Tests (HA 2026.6.4)
    runs-on: ubuntu-latest
    # A real Valkey, matching the engine the fleet runs (READINESS T4). Without
    # it the three Lua scripts in backend.py are exercised only by a double that
    # records eval() calls and returns a canned answer — including the lease,
    # which is the split-brain guard. The tests skip loudly rather than passing
    # quietly when no server is reachable, so a broken service here shows up as
    # skips in the `-rs` summary rather than a false green.
    services:
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CLUSTER_SYNC_TEST_VALKEY: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The generated firewall rulesets are syntax-checked with nft's own
      # parser. `nft -c` needs CAP_NET_ADMIN even though it changes nothing, so
      # the check skips on unprivileged developer machines; the runner has the
      # privileges, which makes CI the only place those rulesets get verified.
      - name: Install nftables and shellcheck (generated-artifact gates)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables shellcheck
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q -rs --cov

  mutation:
    name: Mutation testing (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Deliberately NON-BLOCKING and scheduled rather than per-push: a full
    # mutation run is slow, and its value is trend rather than gate. Done by
    # hand each phase this has found a real defect nearly every time — an
    # untested guard, or a test passing for the wrong reason. This is how that
    # keeps happening once nobody is doing it deliberately.
    continue-on-error: true
    services:
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CLUSTER_SYNC_TEST_VALKEY: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install nftables and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables shellcheck
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run mutmut
        run: mutmut run --max-children 4 || true
      - name: Report surviving mutants
        run: mutmut results || true

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"
      # Scope: the requirements this integration actually installs into a user's
      # Home Assistant, as declared in manifest.json. The dev/test tree (Home
      # Assistant core itself and its ~200 transitive deps) is not shipped by us
      # and is not this gate's business — auditing it would drown a real finding
      # about our own dependency in noise we cannot action.
      - name: Extract runtime requirements from manifest
        run: |
          python -c "import json; print('\n'.join(json.load(open('custom_components/cluster_state_sync/manifest.json'))['requirements']))" \
            | tee runtime-requirements.txt
      - name: Audit runtime requirements
        run: pip-audit --requirement runtime-requirements.txt --strict --progress-spinner off
      # The dev tree, split into what we can act on and what Home Assistant
      # pins for us. A plain pip-audit here is permanently red for reasons
      # nobody in this repository can fix, and a gate that is always red is a
      # gate everyone learns to scroll past. Exits non-zero only on the
      # actionable set. AR-0033: the script existed and was never wired in.
      - name: Install dev requirements for the split audit
        run: pip install -r requirements-dev.txt
      - name: Audit development requirements (actionable vs upstream)
        run: python scripts/audit_deps.py

  sast:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install "$(grep -E '^bandit==' requirements-dev.txt)"
      # Reported in full every run, so nothing is hidden.
      - name: Report every finding
        run: bandit -r custom_components/ scripts/ -f screen || true
      # 🚨 Gates on HIGH severity and HIGH confidence only, deliberately.
      #
      # At medium the current tree fails on three findings that are all
      # false positives: two B105 "hardcoded password" hits on environment
      # variable NAMES, and a B103 on a `chmod 0o750` that is intentional and
      # commented. Gating on those would teach everyone to add `# nosec` until
      # the tool says nothing, which is worse than not running it.
      #
      # And the honest limit, tested rather than assumed: bandit did NOT catch
      # AR-0043. Run against the pre-fix bundle.py it found nothing about the
      # shell injection, because no rule covers BUILDING a string that another
      # machine executes hours later. This job is a regression net for the
      # subprocess, SQL and crypto classes it does understand — not a claim
      # that the largest privileged surface here is covered.
      - name: Fail on high severity
        run: bandit -r custom_components/ scripts/ --severity-level high --confidence-level high

  canary:
    name: Canary (newest Home Assistant)
    runs-on: ubuntu-latest
    # Scheduled and manual only. It is allowed to fail: its job is to go red
    # BEFORE an upgrade does, not to block work on a release nobody has
    # adopted yet. A red canary is a fortnight's warning, not an outage.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    services:
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CLUSTER_SYNC_TEST_VALKEY: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install nftables and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables shellcheck
      # Everything EXCEPT the Home Assistant harness comes from the pin; the
      # harness itself is deliberately unpinned, because it is the variable
      # under test.
      - name: Install with the newest Home Assistant harness
        run: |
          pip install --upgrade pip
          grep -v '^pytest-homeassistant-custom-component==' requirements-dev.txt > /tmp/dev.txt
          pip install -r /tmp/dev.txt
          pip install --upgrade pytest-homeassistant-custom-component
      - name: What did we get?
        run: |
          {
            echo "### Canary"
            echo
            echo "| package | version |"
            echo "|---|---|"
            echo "| homeassistant | $(python -c 'import homeassistant.const as c; print(c.__version__)') |"
            echo "| harness | $(pip show pytest-homeassistant-custom-component | awk '/^Version:/{print $2}') |"
            echo "| pinned in repo | $(grep -oP '(?<=^pytest-homeassistant-custom-component==).*' requirements-dev.txt) |"
          } >> "$GITHUB_STEP_SUMMARY"
      # The compatibility surface: the API symbols we import, and the recorder
      # schema we read directly. The second is the one no test suite notices,
      # because it lives in Home Assistant rather than here.
      - name: Compatibility check
        run: python scripts/ha_compat_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the suite against it
        run: pytest -q -rs

  supported-versions:
    name: Which releases do we promise?
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # 🚨 `hacs.json` declares a MINIMUM, which is a promise about every release
    # above it — not about the one version `requirements-dev.txt` pins. Home
    # Assistant ships monthly, so that promise grows by one untested release
    # every month unless something goes and checks.
    #
    # Derived rather than hardcoded: a hardcoded matrix is a matrix that stops
    # including the release that broke you.
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: derive
        run: |
          set -euo pipefail
          m=$(python scripts/ha_version_matrix.py --json)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          python scripts/ha_version_matrix.py >> "$GITHUB_STEP_SUMMARY"

  compatibility:
    name: HA ${{ matrix.ha }}
    needs: supported-versions
    runs-on: ubuntu-latest
    # Non-blocking on the OLDER releases is deliberately NOT the policy here.
    # A failure against any version in the declared range is a real failure:
    # somebody is running that version because hacs.json said they could.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.supported-versions.outputs.matrix) }}
    services:
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CLUSTER_SYNC_TEST_VALKEY: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 🚨 Must be the version Home Assistant requires. Resolving with an
          # older interpreter does not fail: pip walks BACKWARDS to the newest
          # release that interpreter can run. Doing this locally with a system
          # python3.12 silently installed HA 2025.1.4 — twenty months behind the
          # pin — and the suite went green against it, proving nothing.
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables shellcheck
      - name: Install this exact Home Assistant, and the harness that pins it
        run: |
          set -euo pipefail
          pip install --upgrade pip
          grep -v '^pytest-homeassistant-custom-component==' requirements-dev.txt > /tmp/dev.txt
          pip install -r /tmp/dev.txt
          pip install "homeassistant==${{ matrix.ha }}" pytest-homeassistant-custom-component
          got=$(python -c "import homeassistant.const as c;print(c.__version__)")
          [ "$got" = "${{ matrix.ha }}" ] || {
            echo "::error::asked for ${{ matrix.ha }}, resolved to $got"; exit 1; }
      - name: API surface and recorder schema
        run: python scripts/ha_compat_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Suite
        run: pytest -q -rs

  hassfest:
    name: Validate (hassfest)
    runs-on: ubuntu-latest
    # Home Assistant's own integration validator, run against *current* HA
    # rather than the version we pin. Catches manifest errors and declarations
    # that have been deprecated out from under us.
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate (HACS)
    runs-on: ubuntu-latest
    # Checks the repository is actually installable. This is the gate that
    # would have caught the custom_components symlink, which left the suite
    # entirely green while nobody could install the integration.
    #
    # Non-blocking. It is a useful signal rather than a gate: a HACS failure
    # means users cannot install this, which matters more than any test here,
    # but it also fails for reasons outside a contributor's control.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
