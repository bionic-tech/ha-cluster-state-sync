# Tooling configuration only.
#
# cluster_state_sync is a Home Assistant custom integration, not a distributable
# Python package — it is installed by copying the `cluster_state_sync/` directory
# into `config/custom_components/`. There is deliberately no [project] table, so
# neither pip nor uv tries to build this repo as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-homeassistant-custom-component blocks real sockets by default; that is
# the behaviour we want, so a test that quietly tries to reach a real Redis or a
# real HA instance fails loudly instead of passing on someone's workstation.
# 🚨 `--timeout` is here because a hang cost twenty minutes of wall clock on
# 2026-09-11 before anyone knew it was a hang rather than a slow suite. One
# async test sat idle in the event loop awaiting a future that never resolved;
# `py-spy` found it, and the run had used 47 seconds of CPU in 21 minutes.
#
# It did not reproduce on the next run, so this is not a fix — it is the
# difference between a flake that announces itself with a test name and one
# that looks like the machine being slow. 300s is far above the slowest real
# test here (the whole suite is ~1350 tests in ~260s), so it cannot fire on
# anything but a genuine stall, including on a slower CI runner.
addopts = "--strict-markers --timeout=300 --timeout-method=thread"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tools"]


[tool.coverage.run]
source = ["custom_components/cluster_state_sync"]
branch = true

[tool.coverage.report]
# Measured 93.5% with branch coverage on 2026-08-26. The floor sits a point
# below so ordinary churn does not break the build while real erosion does —
# a gate that fires on a half-percent dip gets raised until it means nothing.
# Raise it when it is comfortably exceeded; never lower it to make a red build
# green.
fail_under = 92
# 🚨 Without this the floor above is a different number than it looks.
#
# coverage.py rounds the total to `precision` digits BEFORE comparing it to
# `fail_under`, and the default precision is 0 — so `fail_under = 92` really
# enforced 91.5, and pytest-cov printed "FAIL Required test coverage of 92.0%
# not reached. Total coverage: 91.89%" while exiting 0 and letting `./check`
# report all gates passed. A gate that prints FAIL and passes is worse than no
# gate: it is a gate you stop reading.
#
# Found 2026-09-09 when two consecutive runs of the same tree straddled the
# boundary and disagreed about whether the build was green.
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
paths_to_mutate = ["custom_components/cluster_state_sync/"]
tests_dir = ["tests/"]
